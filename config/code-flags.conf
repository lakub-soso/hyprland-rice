# Extra flags for VS Code (read by /usr/bin/code from visual-studio-code-bin).
# Electron picks its secret store from XDG_CURRENT_DESKTOP and doesn't know
# "Hyprland", so it falls back to "weaker encryption". Point it at the
# Secret Service (gnome-keyring, unlocked at login by SDDM's PAM).
--password-store=gnome-libsecret
