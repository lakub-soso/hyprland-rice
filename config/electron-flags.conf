# Flags for every app that runs on Arch's system Electron (/usr/bin/electronNN):
# Bitwarden, Element, Signal, Obsidian, … The launcher reads
# electronNN-flags.conf first, then falls back to this file.
# See code-flags.conf for why: Electron doesn't recognise Hyprland as a desktop
# and would otherwise skip the keyring.
--password-store=gnome-libsecret
