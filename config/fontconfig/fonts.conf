<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Font fallback order (linked to ~/.config/fontconfig/fonts.conf).
     Without this, emoji fell through to monochrome fonts: 😀 ❤ ☀ came from
     DejaVu, 👍 ⏯ from Noto Sans Symbols 2. Here each generic family gets its
     main font, then Noto Color Emoji, then CJK — so any glyph the main font
     lacks comes from the colour emoji font before anything monochrome. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
  <!-- apps that ask for "emoji" explicitly -->
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
