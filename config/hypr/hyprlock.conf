# hyprlock — lock screen (SUPER + L). Catppuccin Macchiato, mauve accent.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# hyprlock uses hyprlang (.conf), not Lua like hyprland.lua.
# Palette mirrors config/theme/macchiato.css / hypr/modules/colors.lua.

$text     = rgb(cad3f5)
$subtext0 = rgb(a5adcb)
$overlay0 = rgb(6e738d)
$surface0 = rgb(363a4f)
$base     = rgb(24273a)
$crust    = rgb(181926)
$mauve    = rgb(c6a0f6)
$blue     = rgb(8aadf4)
$red      = rgb(ed8796)
$peach    = rgb(f5a97f)
$yellow   = rgb(eed49f)

$font = Noto Sans

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Blurred, dimmed snapshot of the desktop; falls back to $base
background {
    monitor =
    path = screenshot
    color = $base
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.2
}

# Time
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font Bold
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext0
    font_size = 20
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 340, 56
    rounding = 12
    outline_thickness = 3
    outer_color = $mauve $blue 45deg   # same gradient as the active window border
    inner_color = $surface0
    font_color = $text
    font_family = $font

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb">Password…</span>
    hide_input = false

    check_color = $peach       # while verifying
    fail_color = $red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $yellow

    position = 0, -40
    halign = center
    valign = center
}

# Hint
label {
    monitor =
    text = Locked · type your password
    color = $overlay0
    font_size = 12
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
