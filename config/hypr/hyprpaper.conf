# hyprpaper — wallpaper. https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# Image: data/wallpapers/ in the repo (linked to ~/.local/share/wallpapers/),
# from https://wallhaven.cc/w/ly3x32
# Same image is used on the SDDM login screen (see system/).
# This is the default: the wallpaper picker (SUPER + W, rofi/scripts/wallpaper.py)
# starts hyprpaper from a copy in ~/.local/state with the picked path swapped in.

splash = false

wallpaper {
    monitor =                 # empty = every monitor
    path = ~/.local/share/wallpapers/wallhaven-ly3x32.png
    fit_mode = cover          # fill, crop edges (portrait screen crops the sides)
}
