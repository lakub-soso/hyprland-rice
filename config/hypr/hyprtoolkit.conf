# hyprtoolkit theme — used by Hyprland's own GUI tools (the screen-share
# picker from xdg-desktop-portal-hyprland, hyprland-guiutils dialogs…).
# Catppuccin Macchiato Mauve, same as config/theme/macchiato.css.

background       = rgba(24273aff)   # base
base             = rgba(363a4fff)   # surface0 — buttons, list rows
alternate_base   = rgba(1e2030ff)   # mantle
text             = rgba(cad3f5ff)   # text
bright_text      = rgba(24273aff)   # text on accent (selected tab, Share button)
link_text        = rgba(8aadf4ff)   # blue
accent           = rgba(c6a0f6ff)   # mauve
accent_secondary = rgba(b7bdf8ff)   # lavender

font_family           = Noto Sans
font_family_monospace = JetBrains Mono
icon_theme            = Papirus-Dark
