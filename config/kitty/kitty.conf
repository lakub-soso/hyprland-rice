# kitty config — https://sw.kovidgoyal.net/kitty/conf/
# Nerd Font: needed for the Starship prompt icons (config/starship.toml)
font_family      JetBrainsMono Nerd Font
font_size        12.0

window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# Translucent background (text stays opaque); Hyprland blurs what's behind
background_opacity 0.85

# Catppuccin Macchiato
include macchiato.conf
