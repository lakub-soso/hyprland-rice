# mpv — Catppuccin Macchiato, mauve accent.
# Colours from the official theme: https://github.com/catppuccin/mpv
#   (themes/macchiato/mauve.conf)
# Controls: uosc (AUR mpv-uosc), linked into ~/.config/mpv by
# `./install.sh theme`. uosc turns the built-in OSC off by itself, so without
# it mpv just falls back to its standard controls.

# --- look ---------------------------------------------------------------------
background-color='#24273a'
osd-back-color='#181926'
osd-border-color='#181926'
osd-color='#cad3f5'
osd-shadow-color='#24273a'
osd-font='Noto Sans'
osd-bar=no                 # uosc draws its own seek/volume bars (its README)

# Stats overlay (i / I) — colours are #BBGGRR
script-opts-append=stats-border_color=30201e
script-opts-append=stats-font_color=f5d3ca
script-opts-append=stats-plot_bg_border_color=f6a0c6
script-opts-append=stats-plot_bg_color=30201e
script-opts-append=stats-plot_color=f6a0c6

# uosc colours (ignored if uosc isn't installed)
script-opts-append=uosc-color=foreground=c6a0f6,foreground_text=363a4f,background=24273a,background_text=cad3f5,curtain=1e2030,success=a6da95,error=ed8796

# --- behaviour ------------------------------------------------------------------
keep-open=yes              # stay on the last frame instead of closing
save-position-on-quit=yes  # resume where you left off
hwdec=auto-safe            # GPU video decoding (NVIDIA: nvdec)
