# Per-user makepkg overrides (read after /etc/makepkg.conf), linked to
# ~/.config/pacman/makepkg.conf.
#
# Don't build -debug split packages. Arch enables `debug` by default, but for
# AUR -bin packages it's useless (prebuilt binaries) and harmful: apps bundling
# the same Electron build produce identical build-id files, so e.g.
# docker-desktop-debug and proton-pass-bin-debug conflict and the whole yay
# transaction fails. makepkg reads OPTIONS from the end, so this wins.
OPTIONS+=(!debug)
