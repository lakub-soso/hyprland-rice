# Qt5 apps (VLC) — qt6ct doesn't reach them. Same Catppuccin palette file as
# qt6ct. Qt5 has no Breeze style installed here, so Fusion. Qt5 apps must be
# started with QT_QPA_PLATFORMTHEME=qt5ct (see data/applications/vlc.desktop);
# the session-wide value is qt6ct for Qt6 apps.
[Appearance]
color_scheme_path=~/.config/qt6ct/colors/catppuccin-macchiato.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=xdgdesktopportal
style=Fusion

[Fonts]
fixed="DejaVu Sans Mono,11,-1,5,50,0,0,0,0,0"
general="Noto Sans,11,-1,5,50,0,0,0,0,0"
