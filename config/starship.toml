# Starship prompt — Catppuccin Macchiato powerline, mauve accent.
# p10k-"rainbow"-like two-line layout. Needs a Nerd Font (kitty: JetBrainsMono
# Nerd Font). Docs: https://starship.rs/config/
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "catppuccin_macchiato"

format = """
[](mauve)\
$os\
$username\
[](bg:lavender fg:mauve)\
$directory\
[](bg:blue fg:lavender)\
$git_branch\
$git_status\
[](bg:teal fg:blue)\
$nodejs$python$rust$golang$java$c$docker_context\
[](bg:surface1 fg:teal)\
$time\
[](fg:surface1)\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bg:mauve fg:crust"
format = "[ $symbol]($style)"
[os.symbols]
Arch = ""

[username]
show_always = true
style_user = "bg:mauve fg:crust"
style_root = "bg:mauve fg:red"
format = "[ $user ]($style)"

[directory]
style = "bg:lavender fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:blue fg:crust"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:blue fg:crust"
format = "[($all_status$ahead_behind )]($style)"

[nodejs]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol( $version) ]($style)"

[python]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol( $version)( \\($virtualenv\\)) ]($style)"

[rust]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol( $version) ]($style)"

[golang]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol( $version) ]($style)"

[java]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol( $version) ]($style)"

[c]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol( $version) ]($style)"

[docker_context]
symbol = ""
style = "bg:teal fg:crust"
format = "[ $symbol( $context) ]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:surface1 fg:text"
format = "[  $time ]($style)"

[cmd_duration]
min_time = 2000
format = " [took $duration](fg:yellow)"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:mauve)"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
