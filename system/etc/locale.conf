# System locale. Copied to /etc by ./install.sh system, which also generates
# any locale listed here that /etc/locale.gen doesn't have yet. Re-login to apply.
#
# Interface language: US English. Everything "regional" from en_GB:
#   LC_TIME        24-hour clock, dd/mm/yyyy, weeks start on Monday
#   LC_MEASUREMENT metric (km, kg, °C in apps that follow the locale)
#   LC_PAPER       A4
LANG=en_US.UTF-8
LC_TIME=en_GB.UTF-8
LC_MEASUREMENT=en_GB.UTF-8
LC_PAPER=en_GB.UTF-8
