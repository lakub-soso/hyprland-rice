# Cloudflare over TLS, so the router/ISP can neither read nor rewrite lookups.
# The #cloudflare-dns.com suffix is the name the TLS certificate is checked against.
# Malware blocking instead: 1.1.1.2 / 1.0.0.2 / 2606:4700:4700::1112 / ::1002
# (security.cloudflare-dns.com). Adult content too: …3 (family.cloudflare-dns.com).
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com
# Strict: no silent fallback to plain DNS. Captive-portal Wi-Fi (hotels,
# trains) can't log in like this; see README "DNS" for the temporary switch.
DNSOverTLS=yes
# "~." routes every domain here, not to the DHCP-provided (router) server.
Domains=~.
# LLMNR answers name queries from anyone on the LAN (spoofable); mDNS is left
# to Avahi if it's ever installed.
LLMNR=no
MulticastDNS=no
